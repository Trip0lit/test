{%- comment -%} Tampon encreur circulaire (décoratif). Paramètres : texte, centre, classe {%- endcomment -%}
<div class="stamp {{ include.classe }}" aria-hidden="true">
  <svg viewBox="0 0 120 120">
    <defs><path id="cercle-{{ include.classe | slugify }}" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
    <circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="60" cy="60" r="33" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text font-size="11" fill="currentColor"><textPath href="#cercle-{{ include.classe | slugify }}">{{ include.texte }}</textPath></text>
    <text x="60" y="73" font-size="36" text-anchor="middle" fill="currentColor" style="font-family: var(--serif); font-weight: 400; letter-spacing: 0">{{ include.centre }}</text>
  </svg>
</div>
